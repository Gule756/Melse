openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: services
    description: Service catalog
  - name: technicians
    description: Verified technician discovery
  - name: requests
    description: Customer service requests
  - name: bookings
    description: Booking and job tracking
  - name: dashboard
    description: Operational summaries
  - name: business
    description: Business accounts
  - name: phase3
    description: HomeCare, promotions, and loyalty
  - name: support
    description: Transparent support assistance
  - name: admin
    description: Admin controls and operations
  - name: payments
    description: Payment provider abstraction
  - name: authentication
    description: Session authentication and account identity
  - name: provider
    description: Provider services, availability, offers, and jobs
  - name: emergency
    description: Safety-gated emergency dispatch
  - name: communications
    description: Persistent booking conversations and notifications
  - name: trust
    description: Reviews and disputes
  - name: payouts
    description: Provider earnings and payout operations
paths:
  /bookings/{id}/payment:
    post:
      operationId: initiateBookingPayment
      tags: [payments]
      summary: Initiate a booking payment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "202":
          description: Payment pending provider confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentInitiationResponse"
  /payments/{transactionId}/verify:
    post:
      operationId: verifyPayment
      tags: [payments]
      summary: Verify a provider payment transaction
      parameters:
        - name: transactionId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentVerificationResponse"
  /admin/verifications:
    get:
      operationId: listAdminVerifications
      tags: [admin]
      summary: List technician verification profiles
      responses:
        "200": { description: Verification queue }
  /admin/verifications/{id}:
    patch:
      operationId: updateAdminVerification
      tags: [admin]
      summary: Update technician verification status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminVerificationInput"
      responses:
        "200": { description: Updated verification }
  /admin/pricing:
    get:
      operationId: listAdminPricing
      tags: [admin]
      summary: List pricing rules
      responses:
        "200": { description: Pricing rules }
  /admin/pricing/{id}:
    patch:
      operationId: updateAdminPricing
      tags: [admin]
      summary: Update a pricing rule
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPricingInput"
      responses:
        "200": { description: Updated pricing rule }
  /admin/dispatch:
    get:
      operationId: listAdminDispatch
      tags: [admin]
      summary: List live dispatch bookings
      responses:
        "200": { description: Active dispatch queue }
  /support/assist:
    post:
      operationId: assistSupport
      tags: [support]
      summary: Get support guidance and escalation signals
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportInput"
      responses:
        "200":
          description: Support guidance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportResponse"
  /homecare/plans:
    get:
      operationId: listHomecarePlans
      tags: [phase3]
      summary: List active HomeCare plans
      responses:
        "200":
          description: HomeCare plans
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HomecarePlan" }
  /homecare/subscribe:
    post:
      operationId: subscribeHomecare
      tags: [phase3]
      summary: Subscribe to a HomeCare plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionInput"
      responses:
        "201": { description: HomeCare subscription }
  /homecare/subscription:
    get:
      operationId: getHomecareSubscription
      tags: [phase3]
      summary: Get the active HomeCare subscription
      responses:
        "200": { description: Active subscription }
  /loyalty:
    get:
      operationId: getLoyaltyAccount
      tags: [phase3]
      summary: Get the customer's loyalty balance
      responses:
        "200": { description: Loyalty balance }
  /promotions/validate:
    post:
      operationId: validatePromotion
      tags: [phase3]
      summary: Validate a promotion code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromotionInput"
      responses:
        "200": { description: Valid promotion }
  /assets:
    get:
      operationId: listAssets
      tags: [phase3]
      summary: List customer assets
      responses:
        "200":
          description: Assets
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Asset" } }
    post:
      operationId: createAsset
      tags: [phase3]
      summary: Register a customer asset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetInput" }
      responses:
        "201": { description: Asset created }
  /maintenance/recommendations:
    get:
      operationId: listMaintenanceRecommendations
      tags: [phase3]
      summary: List transparent maintenance recommendations
      responses:
        "200":
          description: Maintenance recommendations
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MaintenanceRecommendation" } }
  /analytics/summary:
    get:
      operationId: getAnalyticsSummary
      tags: [phase3]
      summary: Get aggregate platform analytics
      responses:
        "200":
          description: Aggregate analytics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticsSummary" }
  /business/register:
    post:
      operationId: registerBusiness
      tags: [business]
      summary: Create a business account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessRegistrationInput"
      responses:
        "201":
          description: Business account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessAccountResponse"
  /business/profile:
    get:
      operationId: getBusinessProfile
      tags: [business]
      summary: Get the authenticated business profile
      responses:
        "200":
          description: Business profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessAccount"
  /auth/register:
    post:
      operationId: registerUserApi
      tags: [authentication]
      summary: Register a customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, phoneNumber, password]
              properties:
                fullName: { type: string, minLength: 2, maxLength: 100 }
                phoneNumber: { type: string, minLength: 9, maxLength: 20 }
                password: { type: string, minLength: 8, maxLength: 256 }
      responses:
        "201": { description: Account registered and session created }
        "409": { description: Phone number is already registered }
  /auth/login:
    post:
      operationId: loginUserApi
      tags: [authentication]
      summary: Start an authenticated session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneNumber, password]
              properties:
                phoneNumber: { type: string }
                password: { type: string }
      responses:
        "200": { description: Authenticated session cookie issued }
        "401": { description: Invalid credentials }
  /auth/logout:
    post:
      operationId: logoutUser
      tags: [authentication]
      summary: End the authenticated session
      responses:
        "204": { description: Session revoked }
  /auth/me:
    get:
      operationId: getCurrentUserApi
      tags: [authentication]
      summary: Get the current user and roles
      responses:
        "200": { description: Current authenticated identity }
        "401": { description: Authentication required }
  /provider/services:
    get:
      operationId: listProviderServices
      tags: [provider]
      summary: List the current provider's services and prices
      responses:
        "200": { description: Provider service catalog }
    put:
      operationId: updateProviderServicesApi
      tags: [provider]
      summary: Replace the current provider's services and pricing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [services]
              properties:
                services:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [categorySlug, pricingModel, amount]
                    properties:
                      categorySlug: { type: string }
                      pricingModel: { type: string, enum: [FIXED, HOURLY, QUOTE] }
                      amount: { type: number, nullable: true, minimum: 0 }
                      minimumCharge: { type: number, nullable: true, minimum: 0 }
      responses:
        "200": { description: Provider services persisted }
  /provider/availability:
    get:
      operationId: getProviderAvailability
      tags: [provider]
      summary: List weekly provider availability
      responses:
        "200": { description: Weekly availability }
    put:
      operationId: updateProviderAvailabilityApi
      tags: [provider]
      summary: Replace weekly provider availability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [availability]
              properties:
                availability:
                  type: array
                  maxItems: 42
                  items:
                    type: object
                    required: [dayOfWeek, startsAt, endsAt, isAvailable]
                    properties:
                      dayOfWeek: { type: number, minimum: 0, maximum: 6 }
                      startsAt: { type: string, pattern: "^(?:[01]\\d|2[0-3]):[0-5]\\d$" }
                      endsAt: { type: string, pattern: "^(?:[01]\\d|2[0-3]):[0-5]\\d$" }
                      isAvailable: { type: boolean }
      responses:
        "200": { description: Weekly availability persisted }
  /provider/requests:
    get:
      operationId: listProviderRequests
      tags: [provider]
      summary: List active offers for the current provider
      responses:
        "200": { description: Matching request offers }
  /provider/requests/{id}/respond:
    post:
      operationId: respondToProviderRequestApi
      tags: [provider]
      summary: Accept or decline an active service offer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [ACCEPT, DECLINE] }
                quotedPrice: { type: number, exclusiveMinimum: 0 }
                message: { type: string, maxLength: 1000 }
      responses:
        "200": { description: Offer response persisted }
        "409": { description: "Offer expired, unavailable, or invalid" }
  /provider/bookings:
    get:
      operationId: listProviderBookings
      tags: [provider]
      summary: List jobs assigned to the current provider
      responses:
        "200": { description: Provider's bookings }
  /emergency/requests:
    post:
      operationId: createEmergencyRequestApi
      tags: [emergency]
      summary: Create a safety-acknowledged emergency dispatch
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serviceSlug, emergencyType, problem, description, address, latitude, longitude, safetyAcknowledged]
              properties:
                serviceSlug: { type: string }
                emergencyType: { type: string, enum: [LOCKSMITH, PLUMBING, ELECTRICAL, ROADSIDE, OTHER] }
                problem: { type: string, minLength: 2, maxLength: 200 }
                description: { type: string, minLength: 5, maxLength: 3000 }
                address: { type: string, minLength: 4, maxLength: 1000 }
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
                safetyAcknowledged: { type: boolean, const: true }
      responses:
        "201": { description: Emergency dispatch created }
        "503": { description: No eligible nearby provider is available }
  /emergency/requests/{id}:
    get:
      operationId: getEmergencyRequestApi
      tags: [emergency]
      summary: Get an emergency dispatch visible to its participants
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Dispatch and consent-based tracking state }
        "404": { description: Dispatch not found }
  /provider/location:
    post:
      operationId: shareProviderLocationApi
      tags: [emergency]
      summary: Share current provider location after explicit opt-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude, longitude, sharingEnabled]
              properties:
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
                sharingEnabled: { type: boolean, const: true }
      responses:
        "200": { description: Location sharing updated }
    delete:
      operationId: stopProviderLocationSharing
      tags: [emergency]
      summary: Stop sharing provider location
      responses:
        "204": { description: Location removed }
  /conversations:
    get:
      operationId: listConversations
      tags: [communications]
      summary: List booking conversations for the current user
      responses:
        "200": { description: Authorized conversations }
  /conversations/{id}/messages:
    get:
      operationId: listConversationMessagesApi
      tags: [communications]
      summary: Read messages in an authorized booking conversation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: before
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          required: false
          schema: { type: number, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200": { description: Persistent messages }
        "404": { description: Conversation not found }
    post:
      operationId: sendConversationMessageApi
      tags: [communications]
      summary: Send a message in an authorized booking conversation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body: { type: string, maxLength: 4000 }
                attachmentUrl: { type: string, description: HTTPS attachment URL }
      responses:
        "201": { description: Message persisted }
  /notifications/{id}/read:
    patch:
      operationId: markNotificationReadApi
      tags: [communications]
      summary: Mark the current user's notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Notification marked as read }
  /providers/{id}/reviews:
    get:
      operationId: listProviderReviewsApi
      tags: [trust]
      summary: List public reviews for a provider
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Provider reviews }
  /bookings/{id}/reviews:
    post:
      operationId: createBookingReviewApi
      tags: [trust]
      summary: Review an eligible completed booking once
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: number, minimum: 1, maximum: 5 }
                comment: { type: string, maxLength: 2000 }
      responses:
        "201": { description: Review created }
  /bookings/{id}/disputes:
    post:
      operationId: openBookingDisputeApi
      tags: [trust]
      summary: Open a participant dispute with optional secure evidence links
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, description]
              properties:
                reason: { type: string, enum: [QUALITY, NO_SHOW, SAFETY, PRICE, DAMAGE, OTHER] }
                description: { type: string, minLength: 10, maxLength: 5000 }
                evidenceUrls: { type: array, maxItems: 10, items: { type: string, description: HTTPS evidence URL } }
      responses:
        "201": { description: Dispute created }
  /admin/disputes:
    get:
      operationId: listAdminDisputes
      tags: [admin, trust]
      summary: List unresolved disputes
      responses:
        "200": { description: Admin dispute queue }
  /admin/disputes/{id}:
    patch:
      operationId: resolveAdminDisputeApi
      tags: [admin, trust]
      summary: Record an admin dispute decision
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, resolution]
              properties:
                status: { type: string, enum: [UNDER_REVIEW, RESOLVED_CUSTOMER, RESOLVED_PROVIDER, CLOSED] }
                resolution: { type: string, minLength: 10, maxLength: 5000 }
      responses:
        "200": { description: Dispute updated }
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List users and server-assigned roles
      responses:
        "200": { description: Admin user list }
  /admin/users/{id}/status:
    patch:
      operationId: updateAdminUserStatusApi
      tags: [admin]
      summary: Suspend or reactivate a user account
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isActive]
              properties:
                isActive: { type: boolean }
      responses:
        "200": { description: Account status updated and sessions revoked when suspended }
  /admin/users/{id}/roles:
    patch:
      operationId: updateAdminUserRoleApi
      tags: [admin]
      summary: Grant or revoke a customer/provider role
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [CUSTOMER, PROVIDER] }
                enabled: { type: boolean, default: true }
      responses:
        "204": { description: User role updated }
  /provider/payouts:
    get:
      operationId: listProviderPayouts
      tags: [payouts]
      summary: View provider earnings and payout history
      responses:
        "200": { description: Earnings and payouts; transfers are manual }
    post:
      operationId: requestProviderPayoutApi
      tags: [payouts]
      summary: Request a balance-backed provider payout
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number, exclusiveMinimum: 0 }
      responses:
        "201": { description: Payout request recorded; no automatic transfer is made }
  /admin/payouts:
    get:
      operationId: listAdminPayouts
      tags: [admin, payouts]
      summary: List unprocessed provider payout requests
      responses:
        "200": { description: Pending and processing payout requests }
  /admin/payouts/{id}:
    patch:
      operationId: processAdminPayoutApi
      tags: [admin, payouts]
      summary: Record or reject a manual bank transfer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, note]
              properties:
                decision: { type: string, enum: [COMPLETE, REJECT] }
                transferReference: { type: string, maxLength: 120 }
                proofUrl: { type: string, description: HTTPS transfer proof URL }
                note: { type: string, minLength: 5, maxLength: 1000 }
      responses:
        "200": { description: Manual payout status persisted }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: List available services
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 120 }
      responses:
        "200":
          description: Service catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
  /technicians:
    get:
      operationId: listTechnicians
      tags: [technicians]
      summary: List verified technicians
      parameters:
        - name: serviceSlug
          in: query
          required: false
          schema:
            type: string
        - name: requestId
          in: query
          required: false
          schema:
            type: string
        - name: latitude
          in: query
          required: false
          schema:
            type: number
        - name: longitude
          in: query
          required: false
          schema:
            type: number
      responses:
        "200":
          description: Matching verified technicians
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Technician"
  /service-requests:
    post:
      operationId: createServiceRequest
      tags: [requests]
      summary: Create a customer service request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceRequestInput"
      responses:
        "201":
          description: Created service request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequest"
    get:
      operationId: listServiceRequests
      tags: [requests]
      summary: List recent service requests
      responses:
        "200":
          description: Recent requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceRequest"
  /bookings:
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Book a technician for a request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "201":
          description: Created booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
  /bookings/{id}:
    get:
      operationId: getBooking
      tags: [bookings]
      summary: Get booking tracking details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Booking details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          description: Booking not found
  /bookings/{id}/status:
    patch:
      operationId: updateBookingStatus
      tags: [bookings]
      summary: Update the current job status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingStatusInput"
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get customer dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /service-history:
    get:
      operationId: getServiceHistory
      tags: [requests]
      summary: Get the customer's service history
      responses:
        "200":
          description: Service history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceRequest"
  /notifications:
    get:
      operationId: listNotifications
      tags: [dashboard]
      summary: List booking notifications
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
  /bookings/{id}/invoice:
    get:
      operationId: getBookingInvoice
      tags: [bookings]
      summary: Get an invoice for a booking
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
  /bookings/{id}/guarantee:
    get:
      operationId: getBookingGuarantee
      tags: [bookings]
      summary: Get a booking service guarantee
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Service guarantee
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Guarantee" }
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Service:
      type: object
      required: [id, slug, name, description, icon, startingPrice, priceMax, arrival, accent]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        icon: { type: string }
        startingPrice: { type: number }
        priceMax: { type: number }
        arrival: { type: string }
        accent: { type: string }
    Technician:
      type: object
      required: [id, name, initials, rating, reviews, verified, distance, eta, earnings, specialty, available]
      properties:
        id: { type: string }
        name: { type: string }
        initials: { type: string }
        rating: { type: number }
        reviews: { type: number }
        verified: { type: boolean }
        distance: { type: string }
        eta: { type: string }
        earnings: { type: string }
        specialty: { type: string }
        available: { type: boolean }
    ServiceRequestInput:
      type: object
      required: [serviceSlug, problem, description, address]
      properties:
        serviceSlug: { type: string }
        problem: { type: string }
        description: { type: string }
        address: { type: string }
        urgency: { type: string }
        preferredAt: { type: string, format: date-time }
        budgetMin: { type: number, minimum: 0 }
        budgetMax: { type: number, minimum: 0 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        problemPhotos:
          type: array
          maxItems: 5
          items: { type: string }
    BusinessRegistrationInput:
      type: object
      required: [phoneNumber, password, fullName, businessName]
      properties:
        phoneNumber: { type: string }
        password: { type: string }
        fullName: { type: string }
        businessName: { type: string }
        registrationNumber: { type: string }
        billingEmail: { type: string }
    BusinessAccount:
      type: object
      required: [id, userId, businessName, createdAt, updatedAt]
      properties:
        id: { type: string }
        userId: { type: string }
        businessName: { type: string }
        registrationNumber: { type: string, nullable: true }
        billingEmail: { type: string, nullable: true }
        createdAt: { type: string }
        updatedAt: { type: string }
    BusinessAccountResponse:
      type: object
      required: [user, account]
      properties:
        user:
          type: object
          required: [id, phoneNumber, fullName, roles]
          properties:
            id: { type: string }
            phoneNumber: { type: string }
            fullName: { type: string }
            roles:
              type: array
              items: { type: string }
        account: { $ref: "#/components/schemas/BusinessAccount" }
    ServiceRequest:
      allOf:
        - $ref: "#/components/schemas/ServiceRequestInput"
        - type: object
          required: [id, status, createdAt, priceMin, priceMax, arrival]
          properties:
            id: { type: string }
            status: { type: string }
            createdAt: { type: string }
            priceMin: { type: number }
            priceMax: { type: number }
            arrival: { type: string }
            preferredAt: { type: string, format: date-time, nullable: true }
            latitude: { type: number, nullable: true }
            longitude: { type: number, nullable: true }
            budgetMin: { type: number, nullable: true }
            budgetMax: { type: number, nullable: true }
            problemPhotos:
              type: array
              items: { type: string }
    BookingInput:
      type: object
      required: [requestId, technicianId]
      properties:
        requestId: { type: string }
        technicianId: { type: string }
    Booking:
      type: object
      required: [id, requestId, technicianId, technicianName, serviceName, address, status, priceMin, priceMax, finalPrice, eta, createdAt, progress]
      properties:
        id: { type: string }
        requestId: { type: string }
        technicianId: { type: string }
        technicianName: { type: string }
        serviceName: { type: string }
        address: { type: string }
        status:
          type: string
          enum: [REQUESTED, SEARCHING, ASSIGNED, ACCEPTED, TECHNICIAN_EN_ROUTE, ARRIVED, IN_PROGRESS, COMPLETED, CUSTOMER_CONFIRMED, PAID, RATED, CANCELLED, DISPUTED, REFUNDED, REASSIGNED]
        priceMin: { type: number }
        priceMax: { type: number }
        finalPrice: { type: number, nullable: true }
        eta: { type: string }
        createdAt: { type: string }
        progress: { type: number }
    BookingStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [REQUESTED, SEARCHING, ASSIGNED, ACCEPTED, TECHNICIAN_EN_ROUTE, ARRIVED, IN_PROGRESS, COMPLETED, CUSTOMER_CONFIRMED, PAID, RATED, CANCELLED, DISPUTED, REFUNDED, REASSIGNED]
        quotedPrice: { type: number, exclusiveMinimum: 0 }
    DashboardSummary:
      type: object
      required: [activeBooking, recentRequests, savedAddress, trustStats]
      properties:
        activeBooking:
          oneOf:
            - $ref: "#/components/schemas/Booking"
            - type: "null"
        recentRequests:
          type: array
          items:
            $ref: "#/components/schemas/ServiceRequest"
    Notification:
      type: object
      required: [id, type, bookingId, title, read, createdAt]
      properties:
        id: { type: string }
        type: { type: string }
        bookingId: { type: string }
        title: { type: string }
        read: { type: boolean }
        createdAt: { type: string }
    Invoice:
      type: object
      required: [id, bookingId, serviceRequestId, status, service, address, subtotal, total, currency, issuedAt]
      properties:
        id: { type: string }
        bookingId: { type: string }
        serviceRequestId: { type: string }
        status: { type: string }
        service: { type: string }
        address: { type: string }
        subtotal: { type: number }
        total: { type: number }
        currency: { type: string }
        issuedAt: { type: string }
    Guarantee:
      type: object
      required: [id, bookingId, guaranteeDays, validUntil, status]
      properties:
        id: { type: string }
        bookingId: { type: string }
        guaranteeDays: { type: number, format: int32 }
        validUntil: { type: string }
        status: { type: string }
    HomecarePlan:
      type: object
      required: [id, name, description, monthlyPrice, visitsPerMonth, isActive]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        monthlyPrice: { type: number }
        visitsPerMonth: { type: number, format: int32 }
        isActive: { type: boolean }
    SupportInput:
      type: object
      required: [message]
      properties:
        message: { type: string }
    SupportResponse:
      type: object
      required: [mode, needsHuman, topic, reply]
      properties:
        mode: { type: string }
        needsHuman: { type: boolean }
        topic: { type: string }
        reply: { type: string }
    AdminVerificationInput:
      type: object
      required: [status]
      properties:
        status: { type: string }
    AdminPricingInput:
      type: object
      required: [basePriceMin, basePriceMax, emergencyFee, platformCommissionRate]
      properties:
        basePriceMin: { type: number }
        basePriceMax: { type: number }
        emergencyFee: { type: number }
        platformCommissionRate: { type: number }
    PaymentInput:
      type: object
      required: [phoneNumber, returnUrl]
      properties:
        phoneNumber: { type: string }
        returnUrl: { type: string }
    PaymentInitiationResponse:
      type: object
      required: [paymentId, transactionId, status]
      properties:
        paymentId: { type: string }
        transactionId: { type: string }
        status: { type: string }
        redirectUrl: { type: string, nullable: true }
    PaymentVerificationResponse:
      type: object
      required: [transactionId, status, verified]
      properties:
        transactionId: { type: string }
        status: { type: string }
        verified: { type: boolean }
    SubscriptionInput:
      type: object
      required: [planId]
      properties:
        planId: { type: string }
    PromotionInput:
      type: object
      required: [code]
      properties:
        code: { type: string }
    AssetInput:
      type: object
      required: [categorySlug, name]
      properties:
        categorySlug: { type: string }
        name: { type: string }
        manufacturer: { type: string }
        model: { type: string }
        lastServicedAt: { type: string }
        notes: { type: string }
    Asset:
      type: object
      required: [id, customerId, categoryId, name, createdAt, updatedAt]
      properties:
        id: { type: string }
        customerId: { type: string }
        categoryId: { type: string }
        name: { type: string }
        manufacturer: { type: string, nullable: true }
        model: { type: string, nullable: true }
        lastServicedAt: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        createdAt: { type: string }
        updatedAt: { type: string }
    MaintenanceRecommendation:
      type: object
      required: [id, assetId, title, reason, dueAt, status, createdAt]
      properties:
        id: { type: string }
        assetId: { type: string }
        title: { type: string }
        reason: { type: string }
        dueAt: { type: string }
        status: { type: string }
        createdAt: { type: string }
    AnalyticsSummary:
      type: object
      required: [users, serviceRequests, completedBookings, generatedAt]
      properties:
        users: { type: number }
        serviceRequests: { type: number }
        completedBookings: { type: number }
        generatedAt: { type: string }
        savedAddress: { type: string }
        trustStats:
          type: object
          required: [verifiedProfessionals, averageRating, guarantee]
          properties:
            verifiedProfessionals: { type: string }
            averageRating: { type: string }
            guarantee: { type: string }
